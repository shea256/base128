<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">How Base128 Encodes Bytes</title><desc id="desc">The UTF-8 bytes for Hi are 01001000 and 01101001. Regrouped and zero-filled: 0100100, 0011010, 0100000. Indices 36, 26, 32 map to a, Q, W. The payload is aQW.</desc>
<rect width="1120" height="560" rx="18" fill="#0c1117"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><text x="40" y="52" font-size="28" fill="#dce7ed" >How Base128 Encodes Bytes</text><g transform="translate(0,-50)"><text x="40" y="177" font-size="14" fill="#9ee8b0" >Bytes</text><text x="40" y="206" font-size="15" fill="#9aaebd" >2 bytes = 16 bits</text><rect x="314" y="142" width="300" height="86" rx="10" fill="#141e27" stroke="#293a45"/><text x="464" y="173" font-size="16" fill="#9aaebd" text-anchor="middle">H · hex 48</text><text x="464" y="209" font-size="26" fill="#dce7ed" text-anchor="middle" font-family="Menlo, Consolas, monospace">01001000</text><rect x="644" y="142" width="300" height="86" rx="10" fill="#141e27" stroke="#293a45"/><text x="794" y="173" font-size="16" fill="#9aaebd" text-anchor="middle">i · hex 69</text><text x="794" y="209" font-size="26" fill="#dce7ed" text-anchor="middle" font-family="Menlo, Consolas, monospace">01101001</text><text x="630" y="260" font-size="16" fill="#9aaebd" text-anchor="middle">↓  Regroup the bitstream from the left</text><text x="40" y="318" font-size="14" fill="#82d6c9" >7-bit groups</text><text x="40" y="347" font-size="15" fill="#9aaebd" >7 bits per symbol</text><rect x="314" y="282" width="190" height="83" rx="10" fill="#141e27" stroke="#293a45"/><text x="409" y="320" font-size="26" fill="#dce7ed" text-anchor="middle" font-family="Menlo, Consolas, monospace"><tspan>0100100</tspan><tspan fill="#edcf82"></tspan></text><text x="409" y="348" font-size="15" fill="#9aaebd" text-anchor="middle">index 36</text><rect x="534" y="282" width="190" height="83" rx="10" fill="#141e27" stroke="#293a45"/><text x="629" y="320" font-size="26" fill="#dce7ed" text-anchor="middle" font-family="Menlo, Consolas, monospace"><tspan>0011010</tspan><tspan fill="#edcf82"></tspan></text><text x="629" y="348" font-size="15" fill="#9aaebd" text-anchor="middle">index 26</text><rect x="754" y="282" width="190" height="83" rx="10" fill="#141e27" stroke="#293a45"/><text x="849" y="320" font-size="26" fill="#dce7ed" text-anchor="middle" font-family="Menlo, Consolas, monospace"><tspan>01</tspan><tspan fill="#edcf82">00000</tspan></text><text x="849" y="348" font-size="15" fill="#9aaebd" text-anchor="middle">index 32</text><text x="630" y="398" font-size="16" fill="#9aaebd" text-anchor="middle">↓  Look up each index in the v4 alphabet</text><text x="40" y="457" font-size="14" fill="#8cbde3" >Base128 symbols</text><text x="40" y="486" font-size="18" fill="#dce7ed" >Payload: aQW</text><rect x="314" y="420" width="190" height="82" rx="10" fill="#14261f" stroke="#365e4a"/><text x="409" y="475" font-size="42" fill="#9ee8b0" text-anchor="middle" font-family="Menlo, Consolas, monospace">a</text><rect x="534" y="420" width="190" height="82" rx="10" fill="#14261f" stroke="#365e4a"/><text x="629" y="475" font-size="42" fill="#9ee8b0" text-anchor="middle" font-family="Menlo, Consolas, monospace">Q</text><rect x="754" y="420" width="190" height="82" rx="10" fill="#14261f" stroke="#365e4a"/><text x="849" y="475" font-size="42" fill="#9ee8b0" text-anchor="middle" font-family="Menlo, Consolas, monospace">W</text><text x="40" y="550" font-size="16" fill="#edcf82" >Gold bits are zero-filled tail bits, not extra input bytes. No padding character is added.</text><text x="40" y="579" font-size="15" fill="#9aaebd" >Seven bits per symbol describes information content; a Unicode symbol may use multiple UTF-8 bytes.</text></g></g></svg>
