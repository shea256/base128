name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm install --no-audit --no-fund
      - run: npm test
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --manifest-path packages/rust/Cargo.toml -- --check
      - run: cargo +stable test --manifest-path packages/rust/Cargo.toml --locked
      - run: cargo +stable clippy --manifest-path packages/rust/Cargo.toml --all-targets --locked -- -D warnings
