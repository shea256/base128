name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read

# New commits supersede older validation for the same PR or branch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['^22.23.4', '^24.22.1']
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --manifest-path packages/rust/Cargo.toml -- --check
      - run: cargo +stable test --manifest-path packages/rust/Cargo.toml --locked
      - run: cargo +stable clippy --manifest-path packages/rust/Cargo.toml --all-targets --locked -- -D warnings
  verus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Verus and its Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$(cat verification/verus/rust-version.txt)" --profile minimal
          version=$(cat verification/verus/version.txt)
          archive="verus-${version}-x86-linux.zip"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/verus-lang/verus/releases/download/release/$version/$archive"
          cd "$RUNNER_TEMP"
          sha256sum --check --ignore-missing "$GITHUB_WORKSPACE/verification/verus/SHA256SUMS"
          unzip -q "$archive"
          echo "$RUNNER_TEMP/verus-x86-linux" >> "$GITHUB_PATH"
      - name: Verify production numeric bodies and reject mutations
        run: python scripts/check-verus.py --check-mutations
  lean:
    runs-on: ubuntu-latest
    # The first run downloads a pinned Lean toolchain; proofs need no Mathlib.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '^24.22.1'
          check-latest: true
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: npm ci --no-audit --no-fund
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification/lean
          auto-config: false
          build: true
          use-github-cache: false
      - name: Audit proofs and compare all three implementations
        run: python scripts/check-lean.py
